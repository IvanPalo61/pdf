<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extractor Estado de Cuenta Amex</title>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --line: #d7dde5;
      --primary: #1769aa;
      --primary-dark: #0f4f86;
      --danger: #b42318;
      --success: #057a55;
      font-family: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 22px;
    }
    .header-inner, main {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 18px; }
    main { padding: 18px 0 30px; display: grid; gap: 14px; }
    .status {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: 15px;
    }
    .panel-body { padding: 16px; }
    .file-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px dashed #a9b4c2;
      background: #f8fafc;
      border-radius: 8px;
      padding: 14px;
    }
    .file-name { color: var(--muted); font-size: 13px; flex: 1; }
    .actions { margin-top: 14px; display: flex; gap: 10px; }
    button {
      height: 39px;
      border-radius: 6px;
      padding: 0 16px;
      border: 1px solid #a9b4c2;
      background: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .message {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 7px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
    }
    .message.error { background: #fff4f2; color: var(--danger); border-color: #f5c2c0; }
    .message.success { background: #f0fdf7; color: var(--success); border-color: #a7f3d0; }
    .message.info { background: #f0f7ff; color: var(--primary); border-color: #bfdbfe; }
    .hidden { display: none !important; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-weight: 700; margin-top: 2px; }
    .saldo { font-size: 20px; color: var(--primary); font-weight: 700; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    th { background: #f1f5f9; }
    td:last-child { text-align: right; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Extractor Estado de Cuenta Amex</h1>
      <div class="status" id="statusText">Listo</div>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-header">Subir PDF</div>
      <div class="panel-body">
        <div class="file-box">
          <div class="file-name" id="fileName">Selecciona el PDF del estado de cuenta</div>
          <input type="file" id="fileInput" accept=".pdf,application/pdf">
        </div>

        <div class="actions">
          <button class="btn-primary" id="extractBtn">Extraer información</button>
          <button id="clearBtn">Limpiar</button>
        </div>

        <div class="message info" id="messageBox">
          Selecciona el PDF y haz clic en Extraer información.
        </div>
      </div>
    </section>

    <section class="panel hidden" id="resultPanel">
      <div class="panel-header">Resultado</div>
      <div class="panel-body" id="resultBody"></div>
    </section>
  </main>

  <script>
    // ⚠️ CAMBIA ESTA URL por la de tu API (con el stage)
    const API_URL = 'https://d66jhejyh8.execute-api.us-east-1.amazonaws.com/prod';

    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const extractBtn = document.getElementById('extractBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusText = document.getElementById('statusText');
    const messageBox = document.getElementById('messageBox');
    const resultPanel = document.getElementById('resultPanel');
    const resultBody = document.getElementById('resultBody');

    let selectedFile = null;

    fileInput.addEventListener('change', () => {
      selectedFile = fileInput.files[0] || null;
      if (selectedFile) {
        fileName.textContent = `${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
        statusText.textContent = 'Archivo listo';
        setMessage('Archivo seleccionado. Haz clic en Extraer información.', 'info');
      } else {
        fileName.textContent = 'Selecciona el PDF del estado de cuenta';
        statusText.textContent = 'Listo';
      }
      resultPanel.classList.add('hidden');
    });

    clearBtn.addEventListener('click', () => {
      fileInput.value = '';
      selectedFile = null;
      fileName.textContent = 'Selecciona el PDF del estado de cuenta';
      statusText.textContent = 'Listo';
      resultPanel.classList.add('hidden');
      setMessage('Selecciona el PDF y haz clic en Extraer información.', 'info');
    });

    extractBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        setMessage('Selecciona un archivo PDF primero.', 'error');
        return;
      }

      extractBtn.disabled = true;
      statusText.textContent = 'Procesando...';
      setMessage('Enviando PDF a la Lambda...', 'info');
      resultPanel.classList.add('hidden');

      try {
        const base64 = await fileToBase64(selectedFile);

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pdf_base64: base64,
            filename: selectedFile.name
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || data.message || 'Error desconocido en la Lambda');
        }

        showResult(data);
        setMessage('Información extraída correctamente.', 'success');
        statusText.textContent = 'Listo';
      } catch (err) {
        setMessage('Error: ' + err.message, 'error');
        statusText.textContent = 'Error';
      } finally {
        extractBtn.disabled = false;
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          resolve(result.includes(',') ? result.split(',')[1] : result);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function setMessage(text, type = 'info') {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function showResult(data) {
      let html = `
        <div class="grid">
          <div>
            <div class="label">Tarjetahabiente</div>
            <div class="value">${data.tarjetahabiente || '—'}</div>
          </div>
          <div>
            <div class="label">Empresa</div>
            <div class="value">${data.empresa || '—'}</div>
          </div>
          <div>
            <div class="label">RFC</div>
            <div class="value">${data.rfc || '—'}</div>
          </div>
          <div>
            <div class="label">Número de cuenta</div>
            <div class="value">${data.numero_cuenta || '—'}</div>
          </div>
          <div>
            <div class="label">Fecha de corte</div>
            <div class="value">${data.fecha_corte || '—'}</div>
          </div>
          <div>
            <div class="label">Fecha límite de pago</div>
            <div class="value">${data.fecha_limite_pago || '—'}</div>
          </div>
        </div>

        <p style="margin-top:16px"><span class="label">Periodo:</span> ${data.periodo || '—'}</p>
        <p><span class="label">Dirección:</span> ${data.direccion || '—'}</p>

        <hr style="border:none; border-top:1px solid #d7dde5; margin:18px 0">

        <div class="grid">
          <div>
            <div class="label">Saldo anterior</div>
            <div class="value">$${data.saldo_anterior || '—'}</div>
          </div>
          <div>
            <div class="label">Pagos y créditos</div>
            <div class="value">$${data.pagos_creditos || '—'}</div>
          </div>
          <div>
            <div class="label">Nuevos cargos</div>
            <div class="value">$${data.nuevos_cargos || '—'}</div>
          </div>
          <div>
            <div class="label">Saldo a pagar</div>
            <div class="saldo">$${data.saldo_a_pagar || '—'}</div>
          </div>
        </div>
      `;

      if (data.total_comisiones) {
        html += `<p style="margin-top:12px"><span class="label">Total comisiones:</span> $${data.total_comisiones}</p>`;
      }

      if (data.transacciones && data.transacciones.length) {
        html += `
          <h3 style="margin:20px 0 8px; font-size:14px">Transacciones (${data.transacciones.length})</h3>
          <table>
            <thead>
              <tr><th>Fecha</th><th>Descripción</th><th>Importe</th></tr>
            </thead>
            <tbody>
              ${data.transacciones.map(t => `
                <tr>
                  <td>${t.fecha}</td>
                  <td>${t.descripcion}</td>
                  <td>$${t.importe_mn}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      if (data.transacciones_financieras && data.transacciones_financieras.length) {
        html += `
          <h3 style="margin:20px 0 8px; font-size:14px">Transacciones financieras</h3>
          <table>
            <thead>
              <tr><th>Concepto</th><th>Importe</th></tr>
            </thead>
            <tbody>
              ${data.transacciones_financieras.map(t => `
                <tr>
                  <td>${t.concepto}</td>
                  <td>$${t.importe}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      resultBody.innerHTML = html;
      resultPanel.classList.remove('hidden');
    }
  </script>
</body>
</html>
