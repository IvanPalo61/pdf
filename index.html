<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Estado de Cuenta Amex</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #006fcf;
            margin-bottom: 8px;
            font-size: 1.6rem;
        }
        p {
            color: #666;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            padding: 12px;
            border: 2px dashed #006fcf;
            border-radius: 10px;
            background: #f8fbff;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #006fcf;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #005bb5;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>📄 Extractor Amex</h1>
        <p>Selecciona el PDF del estado de cuenta</p>

        <form action="https://d66jhejyh8.execute-api.us-east-1.amazonaws.com/default" 
              method="POST" 
              enctype="multipart/form-data">
            
            <input type="file" name="file" accept=".pdf,application/pdf" required>
            <button type="submit">Extraer información</button>
        </form>
    </div>
</body>
</html>
